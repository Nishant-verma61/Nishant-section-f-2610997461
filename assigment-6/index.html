<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Restaurant Menu</title>
</head>
<body>
    <h1>Interactive Restaurant Menu</h1>

    <p>Click different areas of the food image.</p>

    <img src="images/menu.png" width="800" height="500" alt="Restaurant Food Menu" usemap="#foodmap">

    <map name="foodmap">
        <area shape="circle" coords="180,160,70" href="pizza.html" alt="Pizza" target="_blank">
        <area shape="circle" coords="620,150,70" href="burger.html" alt="Burger" target="_blank">
        <area shape="rect" coords="40,350,260,450" href="fries.html" alt="French Fries" target="_blank">
        <area shape="rect" coords="540,350,760,450" href="menucard.html" alt="Menu Card" target="_blank">
        <area shape="poly" coords="350,80,470,80,500,180,320,180" href="sandwich.html" alt="Sandwich" target="_blank">
        <area shape="poly" coords="330,280,470,280,500,390,300,390" href="cake.html" alt="Cake Slice" target="_blank">
        <area shape="default" href="other.html" alt="Other Food" target="_blank">
    </map>
</body>
</html>

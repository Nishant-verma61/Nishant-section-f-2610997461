
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Map Explorer</title>
</head>
<body>
    <h1>World Map Explorer</h1>
    <p>Click the different regions on the map.</p>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRUyogtmSJkn4dpfIVxOas2CpvpgDWY-Q2_pJVceYGKrvGbgCw8p2Yr0wd5&s=10" width="700" height="600" alt="World Map" usemap="#worldmap">

    <map name="worldmap">
        <area shape="circle" coords="550,220,30" href="https://en.wikipedia.org/wiki/India" alt="India" target="_blank">

        <area shape="rect" coords="100,100,250,220" href="https://en.wikipedia.org/wiki/United_States" alt="United States" target="_blank">

        <area shape="poly" coords="550,100,620,110,650,160,620,210,560,190" href="https://en.wikipedia.org/wiki/China" alt="China" target="_blank">

        <area shape="default" href="https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://geology.com/world/world-map.shtml&ved=2ahUKEwihtY_ru76XAxXnTmwGHVkCG3kQFnoECEIQAQ&usg=AOvVaw0uF4xhpMHdb_JSNcPeLmOV" alt="Other World Area" target="_blank">
    </map>
</body>
</html>
